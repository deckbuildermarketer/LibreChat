name: DBM Upstream Conflict Resolver

on:
  push:
    branches:
      - integration/dbm-upstream-merge-2026-08-12

permissions:
  contents: write

concurrency:
  group: dbm-upstream-conflict-resolver
  cancel-in-progress: false

jobs:
  resolve-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[resolve-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git and fetch upstream
        run: |
          git config user.name "DBM Merge Bot"
          git config user.email "deckbuildermarketer@gmail.com"
          git remote add upstream https://github.com/danny-avila/LibreChat.git || true
          git fetch --no-tags upstream main

      - name: Resolve superseded conflicts with current upstream implementations
        run: |
          git checkout upstream/main -- \
            api/package.json \
            api/server/services/Endpoints/agents/initialize.js \
            api/server/services/Endpoints/agents/initialize.spec.js \
            api/server/services/MCP.js \
            api/server/services/MCP.spec.js \
            e2e/specs/mock/subagent-results.spec.ts \
            package-lock.json \
            packages/api/package.json \
            packages/api/src/mcp/connection.ts

          rm -rf .dbm-merge-report
          git rm .github/workflows/dbm-upstream-merge-builder.yml

      - name: Update persistent DBM validation workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/dbm-memory-pr.yml')
          text = path.read_text()
          old = '      - run: npm run build:api\n'
          new = (
              '      - run: npm run build:data-provider\n'
              '      - run: npm run build:data-schemas\n'
              '      - run: npm run build:api\n'
          )
          if old not in text:
              raise SystemExit('Expected legacy DBM build step was not found')
          path.write_text(text.replace(old, new, 1))

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build internal workspaces and API
        run: |
          npm run build:data-provider
          npm run build:data-schemas
          npm run build:api

      - name: Run DBM regression tests
        run: >-
          npm --workspace=packages/api run test:ci -- --runInBand --runTestsByPath
          src/memory/dbmGateway.spec.ts
          src/agents/dbmMemoryRun.spec.ts
          src/agents/subagents.spec.ts

      - name: Commit validated merge resolution
        run: |
          git add -A
          git commit -m "[resolve-bot] Resolve upstream conflicts and preserve validated DBM customizations"
          git push origin HEAD:integration/dbm-upstream-merge-2026-08-12
