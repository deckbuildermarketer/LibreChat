name: Lint for accessibility issues

on:
  pull_request:
    paths:
      - 'client/src/**'
      - '!**.md'
  workflow_dispatch:
    inputs:
      run_workflow:
        description: 'Set to true to run this workflow'
        required: true
        default: 'false'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  axe-linter:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_workflow == 'true')
    
    env:
      AXE_LINTER_API_KEY: ${{ secrets.AXE_LINTER_API_KEY }}

    steps:
      - uses: actions/checkout@v5
      - name: Run axe accessibility linter
        if: env.AXE_LINTER_API_KEY != ''
        uses: dequelabs/axe-linter-action@67f0f5c49a4171cb9171213a2e2ae877386b9a80 # v2.0.0
        with:
          api_key: ${{ env.AXE_LINTER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Accessibility linter unavailable
        if: env.AXE_LINTER_API_KEY == ''
        run: echo "AXE_LINTER_API_KEY is not configured for this fork; skipping optional axe-linter."
