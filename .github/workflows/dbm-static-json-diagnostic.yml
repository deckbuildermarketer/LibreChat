name: DBM Static Autofix

on:
  push:
    branches:
      - integration/dbm-upstream-merge-2026-08-12

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/dbm-upstream-merge-2026-08-12
          fetch-depth: 0

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Normalize imports in PR-changed source files
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="19bc7948c85fe5a53062429fb79c4cd4deb510db"
          mapfile -d '' -t CHANGED_FILES < <(
            git diff -z --name-only --diff-filter=ACMRTUXB "$BASE_SHA" HEAD |
              grep -zE '^(api|client|packages)/.*\.(js|jsx|ts|tsx)$' || true
          )

          if [[ ${#CHANGED_FILES[@]} -eq 0 ]]; then
            echo "No changed JS/TS source files found."
            exit 0
          fi

          echo "Checking ${#CHANGED_FILES[@]} changed source files."
          node scripts/sort-imports.mts "${CHANGED_FILES[@]}"

      - name: Commit import-order fixes
        shell: bash
        run: |
          set -euo pipefail
          git add api client packages

          if git diff --cached --quiet; then
            echo "No import-order changes were necessary."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: normalize imports for static checks"
          git push origin HEAD:integration/dbm-upstream-merge-2026-08-12
