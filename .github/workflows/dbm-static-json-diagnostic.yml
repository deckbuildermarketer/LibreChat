name: DBM Static Autofix

on:
  push:
    branches:
      - integration/dbm-upstream-merge-2026-08-12

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/dbm-upstream-merge-2026-08-12
          fetch-depth: 0

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Apply repository formatting rules
        run: |
          npx prettier --write api/server/services/Endpoints/agents/initialize.spec.js
          npm run sort-imports -- packages/api/src/app/metrics.ts packages/api/src/rum/proxy.ts

      - name: Commit formatting fixes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            api/server/services/Endpoints/agents/initialize.spec.js \
            packages/api/src/app/metrics.ts \
            packages/api/src/rum/proxy.ts

          if git diff --cached --quiet; then
            echo "No formatting changes were necessary."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: apply static check formatting"
          git push origin HEAD:integration/dbm-upstream-merge-2026-08-12
