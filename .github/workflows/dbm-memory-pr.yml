name: DBM Integrations PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbm-integrations-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-dbm-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build data-provider
        run: npm run build:data-provider

      - name: Build data-schemas
        run: npm run build:data-schemas

      - name: Build API
        run: npm run build:api

      - name: Run DBM Executive blueprint tests
        run: npm run test:config -- dbm-executive/blueprint.spec.js --runInBand

      - name: Run DBM memory and subagent regression tests
        run: >-
          npm --workspace=packages/api run test:ci -- --runInBand --runTestsByPath
          src/memory/dbmGateway.spec.ts
          src/agents/dbmMemoryRun.spec.ts
          src/agents/discovery.spec.ts
