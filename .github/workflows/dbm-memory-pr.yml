name: DBM Memory PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build:api
      - run: npm --workspace=packages/api test -- --runInBand src/memory/dbmGateway.spec.ts src/agents/dbmMemoryRun.spec.ts src/agents/subagents.spec.ts
