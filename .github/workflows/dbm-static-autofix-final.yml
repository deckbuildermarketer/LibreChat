name: DBM Static Autofix Final

on:
  push:
    branches:
      - integration/dbm-upstream-merge-2026-08-12

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/dbm-upstream-merge-2026-08-12
          fetch-depth: 0

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Refactor nested ternaries without changing behavior
        shell: python
        run: |
          from pathlib import Path

          path = Path('packages/api/src/memory/dbmGateway.ts')
          text = path.read_text()

          aliases_start = text.index('  const possible = Array.isArray(object)')
          aliases_end = text.index('\n\n  const aliases:', aliases_start)
          new_aliases = """  let possible: unknown[] = [];
          if (Array.isArray(object)) {
            possible = object;
          } else {
            const envelope = object as { aliases?: unknown; data?: unknown } | undefined;
            const dataAliases = (envelope?.data as { aliases?: unknown } | undefined)?.aliases;
            if (Array.isArray(envelope?.aliases)) {
              possible = envelope.aliases;
            } else if (Array.isArray(dataAliases)) {
              possible = dataAliases;
            } else if (Array.isArray(envelope?.data)) {
              possible = envelope.data;
            }
          }"""
          text = text[:aliases_start] + new_aliases + text[aliases_end:]

          recall_start = text.index('function readRecallText')
          return_start = text.index('  return {\n    id:', recall_start)
          return_end = text.index('\n  };', return_start) + len('\n  };')
          new_return = """  let id: string | undefined;
          if (typeof record.id === 'string') {
            id = record.id;
          } else if (typeof record.memoryId === 'string') {
            id = record.memoryId;
          }
          return {
            id,
            text: candidate.trim(),
            score: typeof record.score === 'number' ? record.score : undefined,
          };"""
          text = text[:return_start] + new_return + text[return_end:]
          path.write_text(text)

      - name: Apply repository formatting and lint rules
        run: |
          npx prettier --write packages/api/src/memory/dbmGateway.ts packages/api/src/agents/dbmMemoryRun.ts
          node scripts/sort-imports.mts packages/api/src/memory/dbmGateway.ts packages/api/src/agents/dbmMemoryRun.ts
          npx eslint --config eslint.config.mjs --max-warnings=0 packages/api/src/memory/dbmGateway.ts packages/api/src/agents/dbmMemoryRun.ts
          npx prettier --check packages/api/src/memory/dbmGateway.ts packages/api/src/agents/dbmMemoryRun.ts
          node scripts/sort-imports.mts --check packages/api/src/memory/dbmGateway.ts packages/api/src/agents/dbmMemoryRun.ts

      - name: Commit lint fixes
        shell: bash
        run: |
          set -euo pipefail
          git add packages/api/src/memory/dbmGateway.ts packages/api/src/agents/dbmMemoryRun.ts
          if git diff --cached --quiet; then
            echo "No lint changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: satisfy DBM memory static checks"
          git push origin HEAD:integration/dbm-upstream-merge-2026-08-12
