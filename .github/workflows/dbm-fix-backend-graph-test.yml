name: DBM Backend Graph Test Fix

on:
  push:
    branches:
      - integration/dbm-upstream-merge-2026-08-12

permissions:
  contents: write

concurrency:
  group: dbm-backend-graph-test-fix
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, '[backend-fix-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch graph-limit test to follow configured limit
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('api/server/services/Endpoints/agents/initialize.spec.js')
          text = path.read_text()

          pattern = re.compile(
              r"  it\('rejects subagent graphs that exceed MAX_SUBAGENT_GRAPH_NODES unique agents', async \(\) => \{.*?\n  \}\);\n\n  it\('rejects a branching DAG",
              re.S,
          )

          replacement = r'''  it('rejects subagent graphs that exceed MAX_SUBAGENT_GRAPH_NODES unique agents', async () => {
            // Build exactly one more unique subagent than the configured graph limit.
            // A bounded 10-way BFS keeps every agent within the explicit per-parent fanout limit
            // while making this upstream regression test valid for DBM's larger graph budget too.
            const branchingFactor = 10;
            const allIds = Array.from(
              { length: MAX_SUBAGENT_GRAPH_NODES + 1 },
              (_, index) => `agent_graph_${index}`,
            );
            const firstLevelIds = allIds.slice(0, Math.min(branchingFactor, allIds.length));
            const childIdsByParent = new Map();
            const queue = [...firstLevelIds];
            let cursor = firstLevelIds.length;

            while (cursor < allIds.length && queue.length > 0) {
              const parentId = queue.shift();
              const children = allIds.slice(cursor, cursor + branchingFactor);
              cursor += children.length;
              childIdsByParent.set(parentId, children);
              queue.push(...children);
            }

            for (const id of allIds) {
              await createViewableAgent(id, {
                enabled: true,
                allowSelf: false,
                agent_ids: childIdsByParent.get(id) ?? [],
              });
            }

            const primaryConfig = makePrimaryConfig({
              subagents: { enabled: true, allowSelf: false, agent_ids: firstLevelIds },
            });
            mockInitializeAgent.mockResolvedValue(primaryConfig);

            await expect(
              initializeClient({
                req: makeSubagentReq(),
                res: {},
                signal: new AbortController().signal,
                endpointOption: makeEndpointOption(),
              }),
            ).rejects.toThrow(`maximum of ${MAX_SUBAGENT_GRAPH_NODES} unique agents`);
            expect(logger.warn).toHaveBeenCalledWith(
              '[initializeClient] Subagent graph node limit exceeded',
              expect.objectContaining({
                primaryAgentId: PRIMARY_ID,
                loadedSubagentCount: MAX_SUBAGENT_GRAPH_NODES,
                maxSubagentGraphNodes: MAX_SUBAGENT_GRAPH_NODES,
              }),
            );
            expect(agentClientArgs).toBeUndefined();
          });

          it('rejects a branching DAG'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one graph-limit test block, replaced {count}')
          path.write_text(updated)

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build backend workspaces
        run: |
          npm run build:data-provider
          npm run build:data-schemas
          npm run build:api

      - name: Prepare backend test environment
        run: |
          mkdir -p api/data
          echo '{}' > api/data/auth.json
          cp api/test/.env.test.example api/test/.env.test

      - name: Run initialize regression suite
        run: cd api && npm run test:ci -- --runInBand --runTestsByPath server/services/Endpoints/agents/initialize.spec.js

      - name: Commit validated test compatibility fix
        run: |
          git config user.name "DBM Merge Bot"
          git config user.email "deckbuildermarketer@gmail.com"
          git add api/server/services/Endpoints/agents/initialize.spec.js
          git commit -m "[backend-fix-bot] Make graph-limit test honor DBM limits"
          git push origin HEAD:integration/dbm-upstream-merge-2026-08-12
